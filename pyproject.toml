[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamakuraquantlab-qate-env"
version = "0.1.0"
description = "Trading environments for qate: a run's directory, its configuration, and the machine around it"
readme = "README.md"
requires-python = ">=3.11"

license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Kamakura Quant Lab", email = "support@kamakuraquantlab.jp"}]
keywords = ["quantitative-finance", "trading", "configuration", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Same rule as qate, and for the same reason: no HTTP client and no WebSocket
# client, at any depth. This package hands credentials to a gateway, so it is the
# one that would hurt most to have connectivity of its own -- a venue arrives only
# as an adapter registered with qate's registry.
#
# dacite came with `Env.load_object`, which is the only deserializer here; it was
# qate's dependency until this package took the one module that used it.
dependencies = [
    "dacite>=1.9",
    "kamakuraquantlab-qate>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://kamakuraquantlab.jp"
Source = "https://github.com/kamakuraquantlab/qate-env"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qate_env*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned rather than `extend-select`, which inherits ruff's default set. That
# default grew from five families to 414 rules in 0.16, so a version bump silently
# enabled UP, DTZ, TRY, SIM, B, PLR and RET here. Add a family deliberately.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
